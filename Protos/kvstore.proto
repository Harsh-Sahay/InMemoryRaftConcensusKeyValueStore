syntax = "proto3";
option csharp_namespace = "RaftKVStore.Node.Protos";
package kvstore;

service KeyValueStore
{
	rpc Put (PutRequest) returns (PutResponse);
	rpc Get (GetRequest) returns (GetResponse);
}

message PutRequest
{
	string key = 1;
	bytes value = 2;
}

message PutResponse
{
	bool success = 1;
	string redirectLeaderId = 2;
}

message GetRequest 
{
	string key = 1;
}

message GetResponse
{
	bool found = 1;
	bytes value = 2;
	string redirectLeaderId = 3;
}